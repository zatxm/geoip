name: Build and release

on:
  schedule:
    - cron: '7 2 * * *' # Asia/Shanghai 10:07; avoid GitHub's top-of-hour schedule congestion
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: geodata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and common failure cases
        run: |
          shellcheck -x build.sh verify.sh release.sh scripts/*.sh tests/*.sh
          bash tests/test.sh

  release:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/cache@v4
        with:
          path: .cache/tools
          key: rules-tools-linux-amd64-${{ hashFiles('tools.json') }}
      - name: Install pinned upstream conversion tools
        run: bash scripts/setup-tools.sh
      - name: Check binary format and matching semantics
        run: bash tests/test.sh --integration
      - name: Build and verify Loyalsoldier data
        run: bash build.sh
      - name: Publish complete release
        run: bash release.sh dist
